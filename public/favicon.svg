  <!-- Base Infinity Ribbon -->
  <path d="M 88,48 C 71,26 55,15 38,15 C 19,15 9,30 9,48 C 9,66 19,81 38,81 C 55,81 71,70 88,48 C 105,26 121,15 138,15 C 157,15 167,30 167,48 C 167,66 157,81 138,81 C 121,81 105,70 88,48 Z" 
